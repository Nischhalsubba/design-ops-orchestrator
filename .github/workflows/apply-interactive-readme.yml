name: Apply designer README standard

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 0"
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - .github/README_AUTOMATION_REPORT.md

permissions:
  contents: write

jobs:
  apply:
    permissions:
      contents: write
    uses: Nischhalsubba/Nischhalsubba/.github/workflows/reusable-interactive-readme.yml@main

  complete-security-repair:
    needs: apply
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/security-install-repair
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate and integrate security repair
        run: bash .github/scripts/complete-security-repair.sh
