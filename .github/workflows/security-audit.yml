name: Temporary dependency security audit

on:
  push:
    branches:
      - agent/security-audit
    paths:
      - .github/workflows/security-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/security-audit
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve dependency tree without scripts
        id: resolve
        continue-on-error: true
        run: |
          set -o pipefail
          npm install --package-lock-only --ignore-scripts 2>&1 | tee .security-resolve.log

      - name: Audit resolved tree
        id: audit
        if: steps.resolve.outcome == 'success'
        run: npm audit --json > .security-audit.json || true

      - name: Summarize critical through moderate findings
        if: steps.resolve.outcome == 'success'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('.security-audit.json', 'utf8'));
          const wanted = new Set(['critical', 'high', 'moderate']);
          const findings = Object.entries(report.vulnerabilities ?? {})
            .filter(([, value]) => wanted.has(value.severity))
            .map(([name, value]) => ({
              name,
              severity: value.severity,
              direct: Boolean(value.isDirect),
              range: value.range,
              via: (value.via ?? []).map(item => typeof item === 'string' ? item : item.title),
              fixAvailable: value.fixAvailable
            }));
          fs.writeFileSync('.security-audit-summary.json', JSON.stringify({
            counts: report.metadata?.vulnerabilities ?? {},
            findings
          }, null, 2) + '\n');
          NODE

      - name: Record audit diagnostics
        if: always()
        run: |
          printf 'resolve=%s\naudit=%s\n' "${{ steps.resolve.outcome }}" "${{ steps.audit.outcome }}" > .security-audit-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .security-audit-status.txt .security-resolve.log
          if [ -f .security-audit-summary.json ]; then
            git add .security-audit-summary.json
          fi
          git commit -m "Record temporary dependency security audit"
          git push origin HEAD:agent/security-audit

      - name: Fail when dependency resolution failed
        if: always() && steps.resolve.outcome != 'success'
        run: exit 1
