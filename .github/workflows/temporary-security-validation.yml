name: Complete DesignOps security repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-security-validation.yml

permissions:
  contents: write

jobs:
  validate-and-integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/security-install-repair
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate lockfile
        id: lock
        continue-on-error: true
        run: npm install --package-lock-only --ignore-scripts

      - name: Clean install
        id: install
        if: steps.lock.outcome == 'success'
        continue-on-error: true
        run: npm ci

      - name: Lint
        id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run lint > .security-lint.log 2>&1

      - name: Production build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build > .security-build.log 2>&1

      - name: TODO task
        id: todo
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run todo > .security-todo.log 2>&1

      - name: Audit medium and above
        id: audit_gate
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          npm audit --json > .security-audit.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('.security-audit.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          const findings = Object.entries(report.vulnerabilities ?? {})
            .filter(([, value]) => ['critical', 'high', 'moderate'].includes(value.severity))
            .map(([name, value]) => ({name, severity:value.severity, direct:Boolean(value.isDirect), range:value.range, via:(value.via ?? []).map(x => typeof x === 'string' ? x : x.title), fixAvailable:value.fixAvailable}));
          fs.writeFileSync('.security-audit-summary.json', JSON.stringify({counts, findings}, null, 2) + '\n');
          const blocking = (counts.critical ?? 0) + (counts.high ?? 0) + (counts.moderate ?? 0);
          if (blocking > 0) process.exit(1);
          NODE

      - name: Record repair validation
        if: always()
        run: |
          printf 'lock=%s\ninstall=%s\nlint=%s\nbuild=%s\ntodo=%s\naudit=%s\n' "${{ steps.lock.outcome }}" "${{ steps.install.outcome }}" "${{ steps.lint.outcome }}" "${{ steps.build.outcome }}" "${{ steps.todo.outcome }}" "${{ steps.audit_gate.outcome }}" > .security-validation-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .security-validation-status.txt
          for file in .security-lint.log .security-build.log .security-todo.log .security-audit-summary.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Record final DesignOps security validation"
            git push origin HEAD:agent/security-install-repair
          fi

      - name: Integrate validated repair into main
        if: steps.lock.outcome == 'success' && steps.install.outcome == 'success' && steps.build.outcome == 'success' && steps.audit_gate.outcome == 'success'
        run: |
          git fetch origin main agent/security-install-repair
          git switch -C main origin/main
          git checkout origin/agent/security-install-repair -- \
            .eslintrc.cjs \
            gulpfile.js \
            gulp/tasks/admin.js \
            gulp/tasks/assets.js \
            gulp/tasks/content.js \
            gulp/tasks/lint.js \
            gulp/tasks/markup.js \
            gulp/tasks/media.js \
            gulp/tasks/motion.js \
            gulp/tasks/scripts.js \
            gulp/tasks/server.js \
            gulp/tasks/styles.js \
            gulp/utils/ai-healer.js \
            package.json \
            package-lock.json \
            src/styles/abstracts/_variables.scss \
            stylelint.config.js
          git rm -f --ignore-unmatch .github/workflows/temporary-security-validation.yml
          git rm -f --ignore-unmatch .temporary-security-*
          git add -A
          git commit -m "fix: complete DesignOps security repair"
          git push origin HEAD:main

      - name: Require validated integration
        if: always() && (steps.lock.outcome != 'success' || steps.install.outcome != 'success' || steps.build.outcome != 'success' || steps.audit_gate.outcome != 'success')
        run: exit 1
