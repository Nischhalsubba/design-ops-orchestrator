name: DesignOps exact repair validation

on:
  push:
    branches:
      - agent/security-install-repair
    paths:
      - package.json
      - gulpfile.js
      - gulp/tasks/**
      - gulp/utils/ai-healer.js
      - src/styles/abstracts/_variables.scss
      - .eslintrc.cjs
      - stylelint.config.js
      - .github/workflows/security-install-repair.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/security-install-repair
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate lockfile
        id: lock
        continue-on-error: true
        run: npm install --package-lock-only --ignore-scripts

      - name: Clean install
        id: install
        if: steps.lock.outcome == 'success'
        continue-on-error: true
        run: npm ci

      - name: Lint
        id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run lint > .security-lint.log 2>&1

      - name: Production build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build > .security-build.log 2>&1

      - name: TODO task
        id: todo
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run todo > .security-todo.log 2>&1

      - name: Audit locked dependency tree
        if: steps.install.outcome == 'success'
        run: |
          npm audit --json > .security-audit.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('.security-audit.json', 'utf8'));
          const findings = Object.entries(report.vulnerabilities ?? {})
            .filter(([, value]) => ['critical', 'high', 'moderate'].includes(value.severity))
            .map(([name, value]) => ({
              name,
              severity: value.severity,
              direct: Boolean(value.isDirect),
              range: value.range,
              via: (value.via ?? []).map(item => typeof item === 'string' ? item : item.title),
              fixAvailable: value.fixAvailable
            }));
          fs.writeFileSync('.security-audit-summary.json', JSON.stringify({counts: report.metadata?.vulnerabilities ?? {}, findings}, null, 2) + '\n');
          NODE

      - name: Record exact validation result
        if: always()
        run: |
          printf 'lock=%s\ninstall=%s\nlint=%s\nbuild=%s\ntodo=%s\n' "${{ steps.lock.outcome }}" "${{ steps.install.outcome }}" "${{ steps.lint.outcome }}" "${{ steps.build.outcome }}" "${{ steps.todo.outcome }}" > .security-validation-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .security-validation-status.txt
          for file in .security-lint.log .security-build.log .security-todo.log .security-audit-summary.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Record exact DesignOps security validation"
            git push origin HEAD:agent/security-install-repair
          fi

      - name: Require clean install and production build
        if: always() && (steps.lock.outcome != 'success' || steps.install.outcome != 'success' || steps.build.outcome != 'success')
        run: exit 1
