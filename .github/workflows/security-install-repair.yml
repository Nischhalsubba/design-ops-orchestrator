name: DesignOps dependency repair validation

on:
  push:
    branches:
      - agent/security-install-repair
    paths:
      - package.json
      - gulpfile.js
      - gulp/tasks/assets.js
      - gulp/tasks/lint.js
      - gulp/tasks/markup.js
      - gulp/tasks/media.js
      - gulp/tasks/server.js
      - stylelint.config.js
      - .github/workflows/security-install-repair.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/security-install-repair
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply targeted manifest cleanup
        run: |
          npm pkg delete \
            devDependencies.browser-sync \
            devDependencies.gulp-accessibility \
            devDependencies.gulp-avif \
            devDependencies.gulp-concat-css \
            devDependencies.gulp-copy \
            devDependencies.gulp-css-base64 \
            devDependencies.gulp-download \
            devDependencies.gulp-eslint \
            devDependencies.gulp-foreach \
            devDependencies.gulp-htmlmin \
            devDependencies.gulp-imagemin \
            devDependencies.gulp-minify-css \
            devDependencies.gulp-minify-html \
            devDependencies.gulp-newer \
            devDependencies.gulp-order \
            devDependencies.gulp-pug-linter \
            devDependencies.gulp-replace-task \
            devDependencies.gulp-responsive \
            devDependencies.gulp-util \
            devDependencies.gulp-w3c-html-validator \
            devDependencies.gulp-watch \
            devDependencies.gulp-webp \
            devDependencies.gulp-webp-html \
            devDependencies.jest
          npm pkg set \
            devDependencies.gulp-notify="3.2.0" \
            devDependencies.gulp-plumber="^1.2.1" \
            devDependencies.gulp-sourcemaps="2.6.5" \
            devDependencies.pa11y="^9.1.1" \
            devDependencies.sharp="^0.35.3"
          npm install --save-dev critical@latest pug-lint@latest --ignore-scripts
          npm install --save-dev glob@latest postcss@latest --ignore-scripts

      - name: Check direct dependency ranges
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const direct = { ...(pkg.dependencies ?? {}), ...(pkg.devDependencies ?? {}) };
          const unresolved = [];
          for (const [name, range] of Object.entries(direct)) {
            const check = spawnSync('npm', ['view', `${name}@${range}`, 'version', '--json'], { encoding: 'utf8' });
            if (check.status !== 0) {
              unresolved.push({ name, range, error: (check.stderr || check.stdout).trim().split('\n').slice(0, 4).join('\n') });
            }
          }
          fs.writeFileSync('.security-direct-dependency-check.json', JSON.stringify({ unresolved }, null, 2) + '\n');
          NODE

      - name: Resolve lockfile normally
        id: lock
        continue-on-error: true
        run: |
          set -o pipefail
          npm install --package-lock-only --ignore-scripts 2>&1 | tee .security-lock.log

      - name: Clean install
        id: install
        if: steps.lock.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm ci 2>&1 | tee .security-ci.log

      - name: Lint
        id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee .security-lint.log

      - name: Production build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build 2>&1 | tee .security-build.log

      - name: Audit resolved dependencies
        if: steps.install.outcome == 'success'
        run: npm audit --json > .security-audit.json || true

      - name: Summarize audit
        if: steps.install.outcome == 'success'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('.security-audit.json', 'utf8'));
          const wanted = new Set(['critical', 'high', 'moderate']);
          const findings = Object.entries(report.vulnerabilities ?? {})
            .filter(([, value]) => wanted.has(value.severity))
            .map(([name, value]) => ({ name, severity: value.severity, direct: Boolean(value.isDirect), range: value.range, via: (value.via ?? []).map(item => typeof item === 'string' ? item : item.title), fixAvailable: value.fixAvailable }));
          fs.writeFileSync('.security-audit-summary.json', JSON.stringify({ counts: report.metadata?.vulnerabilities ?? {}, findings }, null, 2) + '\n');
          NODE

      - name: Commit build-validated manifest and lockfile
        if: steps.lock.outcome == 'success' && steps.install.outcome == 'success' && steps.build.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Add validated dependency lockfile"
            git push origin HEAD:agent/security-install-repair
          fi

      - name: Record validation diagnostics
        if: always()
        run: |
          printf 'lock=%s\ninstall=%s\nlint=%s\nbuild=%s\n' "${{ steps.lock.outcome }}" "${{ steps.install.outcome }}" "${{ steps.lint.outcome }}" "${{ steps.build.outcome }}" > .security-validation-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .security-validation-status.txt
          for file in .security-direct-dependency-check.json .security-lock.log .security-ci.log .security-lint.log .security-build.log .security-audit-summary.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Record dependency repair validation diagnostics"
            git push origin HEAD:agent/security-install-repair
          fi

      - name: Fail when install or build did not pass
        if: always() && (steps.lock.outcome != 'success' || steps.install.outcome != 'success' || steps.build.outcome != 'success')
        run: exit 1
